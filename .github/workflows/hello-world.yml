steps:
  - name: Installer Node.js
    uses: actions/setup-node@v7
    with:
      node-version: 24.18.0

  - uses: actions/cache@v5
    with:
      path: ~/.npm
      key: npm-${{ hashFiles('package-lock.json') }}

  - name: Lancer les tests
    run: npm test
    env:
      NODE_ENV: test

  - if: always()
    run: echo "Status : ${{ job.status }}"